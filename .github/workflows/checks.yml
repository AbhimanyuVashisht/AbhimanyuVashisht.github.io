name: Checks

# Lint, build and type-check every pull request before it can reach master
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs after the build because it needs next-env.d.ts, which the build generates
      - name: Type check
        run: npx tsc --noEmit
